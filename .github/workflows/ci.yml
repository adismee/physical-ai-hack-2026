name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: lint and tests (with Dream's IK)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - run: git lfs install
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --group dream
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest

  yam:
    name: tests on the YAM station's install (i2rt)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - run: git lfs install
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --extra yam
      - run: uv run pytest tests/test_ik.py tests/test_teleop.py tests/test_config.py tests/test_collect.py tests/test_dataset.py

  secrets:
    name: secret scan
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.18.4 detect --source /repo --redact --verbose
