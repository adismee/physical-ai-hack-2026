# A YAM station: two YAM follower arms (i2rt), one Meta Quest, three cameras.
# Copy this file for your station, then replace every REPLACE value. docs/hardware_setup.md explains each one.

arm: yam
# task: "pick up the red cube and put it in the bowl"  # optional: a task text for every episode; --task overrides it
dataset_dir: ~/hackathon_data/my-task                # one LeRobot v2.1 dataset; each session adds to it
fps: 30                                              # recording rate
control_hz: 60                                       # teleop loop rate (a multiple of fps)
record_width: 640                                    # frames are center-cropped to 16:9 and resized to this
record_height: 360

arms:
  left:
    port: can_follower_l      # the arm's CAN interface (i2rt's bimanual guide names them can_follower_l / _r)
    # Quest frame (x right, y up, z toward you) into the arm's base frame (x forward, y left, z up), for an operator
    # standing behind the arms and facing the way they face. Check it with --dry-run (docs/hardware_setup.md, step 5).
    quest_to_base: [[0, 0, -1], [-1, 0, 0], [0, 1, 0]]
    workspace_min_m: [0.05, -0.45, 0.00]  # the box the tool is kept inside, in the arm's base frame
    workspace_max_m: [0.60, 0.45, 0.55]
  right:
    port: can_follower_r
    quest_to_base: [[0, 0, -1], [-1, 0, 0], [0, 1, 0]]
    workspace_min_m: [0.05, -0.45, 0.00]
    workspace_max_m: [0.60, 0.45, 0.55]

yam:
  gripper: linear_4310        # i2rt's gripper type
  tcp_site: grasp_site        # the site of i2rt's model the Quest drives: i2rt's grasp point of the stock gripper

teleop:
  max_joint_speed_rad_s: 2.0  # no joint target moves faster
  translation_scale: 1.0      # 0.5 moves the tool half as far as your hand
  joint_limit_margin_rad: 0.05

cameras:                      # exactly these three roles; type uvc (any webcam) or realsense
  overhead: {type: uvc, device: /dev/v4l/by-id/REPLACE, width: 1280, height: 720, fps: 30}
  wrist_l: {type: realsense, serial: "REPLACE", width: 1280, height: 720, fps: 30}
  wrist_r: {type: realsense, serial: "REPLACE", width: 1280, height: 720, fps: 30}
